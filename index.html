<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>My project</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0B0D0F;
      overflow: hidden;
    }
    #unity-container {
      width: 100%;
      height: 100%;
      position: relative;
      background: #0B0D0F;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #0B0D0F;
    }
    #museum-loading {
      position: absolute;
      left: 0; top: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0B0D0F;
      color: #E6E9E6;
      font-family: "Gowun Batang", "IBM Plex Sans KR", serif;
      z-index: 10;
    }
    #museum-loading-title {
      font-size: 28px;
      letter-spacing: 0.02em;
      margin-bottom: 18px;
    }
    #museum-progress-track {
      width: 240px;
      height: 3px;
      background: #1B1E21;
      border-radius: 2px;
      overflow: hidden;
    }
    #museum-progress-fill {
      width: 0%;
      height: 100%;
      background: #C8A24E;
      transition: width 0.15s ease-out;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width=1280 height=720 tabindex="-1"></canvas>
    <div id="museum-loading">
      <div id="museum-loading-title">온라인 어진 박물관</div>
      <div id="museum-progress-track"><div id="museum-progress-fill"></div></div>
    </div>
  </div>
  <script src="Build/WebGL.loader.js"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loadingScreen = document.querySelector("#museum-loading");
    var progressFill = document.querySelector("#museum-progress-fill");

    var config = {
      dataUrl: "Build/WebGL.data.unityweb",
      frameworkUrl: "Build/WebGL.framework.js.unityweb",
      codeUrl: "Build/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "My project",
      productVersion: "0.1",
    };

    createUnityInstance(canvas, config, (progress) => {
      progressFill.style.width = Math.round(progress * 100) + "%";
    }).then((unityInstance) => {
      loadingScreen.style.display = "none";
    }).catch((message) => {
      alert(message);
    });
  </script>
</body>
</html>
